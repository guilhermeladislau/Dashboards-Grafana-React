<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Zabbix Infra Monitor Panel for Grafana">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" opacity="0.55" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" />

  <!-- Left column: title and description -->
  <g transform="translate(52, 66)">
    <rect x="0" y="0" width="196" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#f97316" />
    <text x="28" y="18" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6">GRAFANA PANEL PLUGIN</text>

    <text x="0" y="76" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Zabbix Infra Monitor</text>
    <text x="0" y="114" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400">Modular device cards and built-in charts for IT infrastructure</text>
    <text x="0" y="138" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400">dashboards powered by Zabbix data.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 168)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="128" height="30" rx="8" fill="#111827" stroke="#334155" />
      <text x="64" y="19" fill="#e2e8f0" text-anchor="middle">7 Device Types</text>

      <rect x="138" y="0" width="132" height="30" rx="8" fill="#111827" stroke="#334155" />
      <text x="204" y="19" fill="#e2e8f0" text-anchor="middle">9 Built-in Charts</text>

      <rect x="280" y="0" width="154" height="30" rx="8" fill="#111827" stroke="#334155" />
      <text x="357" y="19" fill="#e2e8f0" text-anchor="middle">React 19 + TypeScript</text>
    </g>
  </g>

  <!-- Right column: mini preview cards -->
  <!-- Card 1: Firewall CPU (Circular Gauge) -->
  <g transform="translate(560, 36)">
    <rect width="192" height="126" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 1 12 Q 1 1 12 1 L 180 1 Q 191 1 191 12 L 191 3 L 1 3 Z" fill="#ef4444" />
    <text x="14" y="26" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">FW-BORDA-01</text>
    <rect x="134" y="14" width="44" height="16" rx="8" fill="#14532d" />
    <text x="156" y="25" fill="#4ade80" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>

    <text x="14" y="46" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">Firewall CPU</text>
    <text x="14" y="84" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="800">52.4%</text>
    <text x="14" y="108" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="10">Packet inspection</text>

    <!-- Gauge 360 -->
    <g transform="translate(148, 78)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#1e293b" stroke-width="6" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="79 150" stroke-linecap="round" transform="rotate(-90)" />
      <text x="0" y="4" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">52%</text>
    </g>
  </g>

  <!-- Card 2: Server RAM (Horizontal Bar, Warning) -->
  <g transform="translate(768, 36)">
    <rect width="192" height="126" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 1 12 Q 1 1 12 1 L 180 1 Q 191 1 191 12 L 191 3 L 1 3 Z" fill="#10b981" />
    <text x="14" y="26" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">SRV-PROD-DB01</text>
    <rect x="128" y="14" width="50" height="16" rx="8" fill="#422006" />
    <text x="153" y="25" fill="#facc15" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">WARNING</text>

    <text x="14" y="46" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">Memory usage</text>
    <text x="14" y="78" fill="#facc15" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">78.6%</text>

    <!-- Progress bar -->
    <rect x="14" y="92" width="164" height="8" rx="4" fill="#1e293b" />
    <rect x="14" y="92" width="129" height="8" rx="4" fill="#f59e0b" />
    <text x="14" y="114" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="10">25.1 GB / 32.0 GB</text>
  </g>

  <!-- Card 3: VM CPU Ready (Arc 180) -->
  <g transform="translate(976, 36)">
    <rect width="184" height="126" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 1 12 Q 1 1 12 1 L 172 1 Q 183 1 183 12 L 183 3 L 1 3 Z" fill="#8b5cf6" />
    <text x="14" y="26" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">VM-K8S-NODE02</text>
    <rect x="132" y="14" width="38" height="16" rx="8" fill="#14532d" />
    <text x="151" y="25" fill="#4ade80" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">OK</text>

    <text x="14" y="46" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">vCPU usage</text>
    <text x="14" y="84" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">38.0%</text>
    <text x="14" y="108" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="10">8 vCPUs allocated</text>

    <!-- Semi-gauge arc -->
    <g transform="translate(142, 92)">
      <path d="M -24 0 A 24 24 0 0 1 24 0" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <path d="M -24 0 A 24 24 0 0 1 6 -23" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Card 4: Consolidated Switch / Network Traffic (Area Sparkline) -->
  <g transform="translate(560, 178)">
    <rect width="399" height="126" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 1 12 Q 1 1 12 1 L 387 1 Q 398 1 398 12 L 398 3 L 1 3 Z" fill="#06b6d4" />
    <text x="16" y="26" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">SW-CORE-01 • GI1/0/24 UPLINK</text>
    <rect x="318" y="14" width="66" height="16" rx="8" fill="#083344" />
    <text x="351" y="25" fill="#22d3ee" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">10 Gbps UP</text>

    <text x="16" y="48" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">Inbound throughput (RX)</text>
    <text x="16" y="82" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="800">892.4 Mbps</text>
    <text x="16" y="106" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="10">0 CRC errors • 124k pps</text>

    <!-- Area chart -->
    <g transform="translate(185, 42)">
      <path d="M 0 58 L 24 50 L 48 53 L 72 34 L 96 38 L 120 22 L 144 27 L 168 12 L 196 16 L 196 68 L 0 68 Z" fill="url(#areaGrad)" />
      <path d="M 0 58 L 24 50 L 48 53 L 72 34 L 96 38 L 120 22 L 144 27 L 168 12 L 196 16" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="196" cy="16" r="3.5" fill="#22d3ee" />
    </g>
  </g>

  <!-- Card 5: Host Chassis Temp (Tower / Critical) -->
  <g transform="translate(976, 178)">
    <rect width="184" height="126" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 1 12 Q 1 1 12 1 L 172 1 Q 183 1 183 12 L 183 3 L 1 3 Z" fill="#3b82f6" />
    <text x="14" y="26" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HOST-ESXI-01</text>
    <rect x="122" y="14" width="48" height="16" rx="8" fill="#450a0a" />
    <text x="146" y="25" fill="#f87171" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CRITICAL</text>

    <text x="14" y="46" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">Datastore SAN</text>
    <text x="14" y="84" fill="#f87171" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">91.2%</text>
    <text x="14" y="108" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="10">880 GB free of 10 TB</text>

    <!-- Tower bars -->
    <g transform="translate(128, 52)">
      <rect x="0" y="32" width="7" height="16" rx="2" fill="#22c55e" />
      <rect x="10" y="24" width="7" height="24" rx="2" fill="#22c55e" />
      <rect x="20" y="16" width="7" height="32" rx="2" fill="#f59e0b" />
      <rect x="30" y="8" width="7" height="40" rx="2" fill="#ef4444" />
      <rect x="40" y="0" width="7" height="48" rx="2" fill="#1e293b" />
    </g>
  </g>
</svg>
